<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>zob-sidepanel</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.js"></script>
</head>
<body>
  <main>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="device">Connecting…</div>
    <div class="controls">
      <label>Brightness <input id="brightness" type="range" min="0" max="255" value="128"></label>
      <button id="auto" type="button">Auto</button>
      <button id="apps" type="button">Apps</button>
    </div>
  </main>
</body>
</html>
