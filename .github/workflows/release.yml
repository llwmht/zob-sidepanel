name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Tests
        run: |
          ./gradlew :app:testDebugUnitTest --console=plain
          node --test "tests/web/**/*.test.js"
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIDEPANEL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret SIDEPANEL_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Signed release build
        env:
          SIDEPANEL_KEYSTORE: ${{ runner.temp }}/release.jks
          SIDEPANEL_KEYSTORE_PASSWORD: ${{ secrets.SIDEPANEL_KEYSTORE_PASSWORD }}
          SIDEPANEL_KEY_ALIAS: ${{ secrets.SIDEPANEL_KEY_ALIAS }}
          SIDEPANEL_KEY_PASSWORD: ${{ secrets.SIDEPANEL_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No signed APK was produced"; exit 1; }
          cp "$apk" "zob-sidepanel-$GITHUB_REF_NAME.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "zob-sidepanel-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" --generate-notes
